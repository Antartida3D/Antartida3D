name: Documentación

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: documentacion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Impacto documental
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer el repositorio y el historial del PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Probar el control
        run: node --test scripts/docs/check.test.mjs
      - name: Validar la declaración y los documentos
        run: node scripts/docs/check.mjs
